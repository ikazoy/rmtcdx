name: Changeset Required

on:
  pull_request:

permissions:
  contents: read

jobs:
  changeset-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node ./scripts/check-changeset.mjs
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
