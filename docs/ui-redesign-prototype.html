<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Codex Remote — UI Redesign Prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap');

:root {
  --bg-root: #141414;
  --bg-surface: #1e1e1e;
  --bg-elevated: #242424;
  --bg-hover: rgba(255,255,255,0.06);
  --bg-active: rgba(232,115,74,0.12);
  --border: rgba(255,255,255,0.08);
  --border-focus: rgba(232,115,74,0.5);
  --text-primary: #f2f1ea;
  --text-secondary: #9ca099;
  --text-muted: #686862;
  --accent: #e8734a;
  --accent-soft: rgba(232,115,74,0.15);
  --danger: #e84a4a;
  --danger-soft: rgba(232,74,74,0.12);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-pill: 999px;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --transition-fast: 120ms ease;
  --transition-base: 200ms ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  background: var(--bg-root);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}

/* ─── Layout ─── */
.demo-layout {
  max-width: 420px;
  margin: 0 auto;
  padding: 20px 16px 60px;
  display: flex;
  flex-direction: column;
  gap: 40px;
}

.demo-section {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.demo-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  padding: 0 4px;
}

/* ═══════════════════════════════════════════
   COMPONENT 1: SIDEBAR FILTER PANEL
   ═══════════════════════════════════════════ */

.filter-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

/* ── State Chips ── */
.filter-section {
  padding: 14px 14px 0;
}

.filter-section + .filter-section {
  padding-top: 12px;
}

.filter-section:last-child {
  padding-bottom: 14px;
}

.filter-section__label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
  padding: 0 2px;
}

.chip-track {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 2px;
}

.chip-track::-webkit-scrollbar { display: none; }

.chip {
  flex: 0 0 auto;
  height: 34px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.chip:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.chip.is-active {
  background: var(--accent-soft);
  border-color: rgba(232,115,74,0.3);
  color: var(--accent);
  font-weight: 600;
}

.chip__dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.6;
}

.chip.is-active .chip__dot {
  opacity: 1;
}

/* ── Workspace Combobox ── */
.combobox {
  position: relative;
}

.combobox__trigger {
  width: 100%;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color var(--transition-fast);
  -webkit-tap-highlight-color: transparent;
}

.combobox__trigger:focus-visible {
  outline: none;
  border-color: var(--border-focus);
}

.combobox__trigger[aria-expanded="true"] {
  border-color: var(--border-focus);
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}

.combobox__trigger-text {
  flex: 1;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.combobox__chevron {
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  transition: transform var(--transition-base);
  flex-shrink: 0;
}

.combobox__trigger[aria-expanded="true"] .combobox__chevron {
  transform: rotate(180deg);
}

.combobox__dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  z-index: 50;
  background: var(--bg-elevated);
  border: 1px solid var(--border-focus);
  border-top: none;
  border-radius: 0 0 var(--radius-md) var(--radius-md);
  max-height: 220px;
  display: flex;
  flex-direction: column;
  animation: dropdown-in 150ms ease;
}

@keyframes dropdown-in {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.combobox__search {
  position: sticky;
  top: 0;
  padding: 8px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
}

.combobox__search-input {
  width: 100%;
  height: 34px;
  padding: 0 10px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 13px;
  outline: none;
  transition: border-color var(--transition-fast);
}

.combobox__search-input:focus {
  border-color: var(--border-focus);
}

.combobox__search-input::placeholder {
  color: var(--text-muted);
}

.combobox__list {
  overflow-y: auto;
  padding: 4px;
}

.combobox__option {
  width: 100%;
  height: 40px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  background: none;
  border: none;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: all var(--transition-fast);
  -webkit-tap-highlight-color: transparent;
}

.combobox__option:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.combobox__option.is-active {
  background: var(--accent-soft);
  color: var(--accent);
}

.combobox__option-check {
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.combobox__option-check svg {
  opacity: 0;
  transition: opacity var(--transition-fast);
}

.combobox__option.is-active .combobox__option-check svg {
  opacity: 1;
}

.combobox__option-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.combobox__empty {
  padding: 16px 10px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

/* ── Search Field ── */
.search-field-v2 {
  position: relative;
}

.search-field-v2__icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  pointer-events: none;
}

.search-field-v2__input {
  width: 100%;
  height: 42px;
  padding: 0 36px 0 36px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
  transition: border-color var(--transition-fast);
}

.search-field-v2__input:focus {
  border-color: var(--border-focus);
}

.search-field-v2__input::placeholder {
  color: var(--text-muted);
}

.search-field-v2__clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: 16px;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.search-field-v2__clear:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}


/* ═══════════════════════════════════════════
   COMPONENT 2: THREAD SETTINGS PANEL
   ═══════════════════════════════════════════ */

.settings-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.settings-section {
  padding: 14px;
}

.settings-section + .settings-section {
  border-top: 1px solid var(--border);
}

.settings-section__header {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
  padding: 0 2px;
}

/* ── Custom Select (replaces native <select>) ── */
.custom-select {
  position: relative;
  margin-bottom: 10px;
}

.custom-select:last-child {
  margin-bottom: 0;
}

.custom-select__label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 5px;
  padding: 0 2px;
}

.custom-select__trigger {
  width: 100%;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color var(--transition-fast);
  -webkit-tap-highlight-color: transparent;
}

.custom-select__trigger:focus-visible {
  outline: none;
  border-color: var(--border-focus);
}

.custom-select__trigger[aria-expanded="true"] {
  border-color: var(--border-focus);
}

.custom-select__trigger-value {
  flex: 1;
  text-align: left;
}

.custom-select__chevron {
  width: 14px;
  height: 14px;
  color: var(--text-muted);
  transition: transform var(--transition-base);
  flex-shrink: 0;
}

.custom-select__trigger[aria-expanded="true"] .custom-select__chevron {
  transform: rotate(180deg);
}

.custom-select__menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  z-index: 60;
  background: var(--bg-elevated);
  border: 1px solid var(--border-focus);
  border-radius: var(--radius-md);
  padding: 4px;
  animation: dropdown-in 150ms ease;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.custom-select__option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 8px 10px;
  background: none;
  border: none;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  transition: all var(--transition-fast);
  -webkit-tap-highlight-color: transparent;
}

.custom-select__option:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.custom-select__option.is-active {
  background: var(--accent-soft);
  color: var(--accent);
}

.custom-select__option-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.custom-select__option-label {
  font-weight: 500;
}

.custom-select__option-desc {
  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.3;
}

.custom-select__option.is-active .custom-select__option-desc {
  color: rgba(232,115,74,0.6);
}

.custom-select__option-check {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.custom-select__option-check svg {
  opacity: 0;
}

.custom-select__option.is-active .custom-select__option-check svg {
  opacity: 1;
  color: var(--accent);
}

.custom-select__hint {
  font-size: 11.5px;
  color: var(--text-muted);
  padding: 2px 2px 4px;
  line-height: 1.4;
}

/* ── Action Buttons ── */
.action-row {
  display: flex;
  gap: 8px;
}

.action-btn {
  flex: 1;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
  -webkit-tap-highlight-color: transparent;
}

.action-btn:hover {
  background: var(--bg-hover);
  border-color: rgba(255,255,255,0.14);
  color: var(--text-primary);
}

.action-btn:active {
  transform: scale(0.98);
}

.action-btn--danger {
  color: var(--danger);
  border-color: rgba(232,74,74,0.2);
}

.action-btn--danger:hover {
  background: var(--danger-soft);
  border-color: rgba(232,74,74,0.3);
  color: var(--danger);
}

.action-btn__icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

/* ── Debug Disclosure ── */
.debug-disclosure {
  overflow: hidden;
}

.debug-disclosure__trigger {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 2px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.debug-disclosure__trigger:hover {
  color: var(--text-secondary);
}

.debug-disclosure__chevron {
  width: 12px;
  height: 12px;
  transition: transform var(--transition-base);
}

.debug-disclosure__trigger[aria-expanded="true"] .debug-disclosure__chevron {
  transform: rotate(90deg);
}

.debug-disclosure__body {
  display: none;
  margin-top: 10px;
}

.debug-disclosure__trigger[aria-expanded="true"] + .debug-disclosure__body {
  display: block;
}

.debug-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 0;
}

.debug-row + .debug-row {
  border-top: 1px solid var(--border);
}

.debug-row__label {
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
  flex-shrink: 0;
}

.debug-row__value {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-secondary);
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.debug-row__copy {
  display: flex;
  align-items: center;
  gap: 6px;
}

.debug-row__copy-btn {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  cursor: pointer;
  transition: all var(--transition-fast);
  flex-shrink: 0;
}

.debug-row__copy-btn:hover {
  border-color: rgba(255,255,255,0.16);
  color: var(--text-secondary);
}

.debug-row__copy-btn svg {
  width: 12px;
  height: 12px;
}

/* ── Reset link ── */
.settings-reset {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
  padding: 0 2px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-size: 12px;
  cursor: pointer;
  transition: color var(--transition-fast);
}

.settings-reset:hover {
  color: var(--text-secondary);
}

.settings-note {
  font-size: 11.5px;
  color: var(--text-muted);
  padding: 8px 2px 0;
  line-height: 1.4;
}
</style>
</head>
<body>

<div class="demo-layout">

  <!-- ═══ COMPONENT 1: SIDEBAR FILTER PANEL ═══ -->
  <div class="demo-section">
    <span class="demo-label">Component 1 — Sidebar Filters</span>

    <div class="filter-panel">

      <!-- State Chips -->
      <div class="filter-section">
        <div class="filter-section__label">State</div>
        <div class="chip-track" id="chipTrack">
          <button class="chip is-active" data-filter="all"><span class="chip__dot"></span>All</button>
          <button class="chip" data-filter="running"><span class="chip__dot"></span>Running</button>
          <button class="chip" data-filter="unread"><span class="chip__dot"></span>Unread</button>
          <button class="chip" data-filter="completed">Completed</button>
          <button class="chip" data-filter="interrupted">Interrupted</button>
          <button class="chip" data-filter="error">Error</button>
          <button class="chip" data-filter="archived">Archived</button>
        </div>
      </div>

      <!-- Workspace Combobox -->
      <div class="filter-section">
        <div class="filter-section__label">Workspace</div>
        <div class="combobox" id="workspaceCombobox">
          <button
            class="combobox__trigger"
            type="button"
            role="combobox"
            aria-expanded="false"
            aria-haspopup="listbox"
            id="comboboxTrigger"
          >
            <span class="combobox__trigger-text">All projects</span>
            <svg class="combobox__chevron" viewBox="0 0 16 16" fill="none">
              <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="combobox__dropdown" id="comboboxDropdown" style="display:none" role="listbox">
            <div class="combobox__search">
              <input
                class="combobox__search-input"
                type="text"
                placeholder="Search workspaces..."
                id="comboboxSearch"
                autocomplete="off"
              />
            </div>
            <div class="combobox__list" id="comboboxList">
              <button class="combobox__option is-active" role="option" aria-selected="true">
                <span class="combobox__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span class="combobox__option-label">All projects</span>
              </button>
              <button class="combobox__option" role="option" aria-selected="false">
                <span class="combobox__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span class="combobox__option-label">remote-control-codex</span>
              </button>
              <button class="combobox__option" role="option" aria-selected="false">
                <span class="combobox__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span class="combobox__option-label">api-gateway</span>
              </button>
              <button class="combobox__option" role="option" aria-selected="false">
                <span class="combobox__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span class="combobox__option-label">mobile-app-ios</span>
              </button>
              <button class="combobox__option" role="option" aria-selected="false">
                <span class="combobox__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span class="combobox__option-label">infra-terraform</span>
              </button>
              <button class="combobox__option" role="option" aria-selected="false">
                <span class="combobox__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span class="combobox__option-label">design-system</span>
              </button>
              <button class="combobox__option" role="option" aria-selected="false">
                <span class="combobox__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span class="combobox__option-label">data-pipeline</span>
              </button>
              <button class="combobox__option" role="option" aria-selected="false">

            <button class="custom-select__option" role="option">

              <span class="custom-select__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

              <span class="custom-select__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

          <div class="custom-select__menu" style="display:none" role="listbox">
            <button class="custom-select__option is-active" role="option">
              <span class="custom-select__option-content">

              <span class="custom-select__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </button>
            <button class="custom-select__option" role="option">

                <span class="custom-select__option-label">Read only</span>
              </span>
              <span class="custom-select__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </button>
            <button class="custom-select__option" role="option">
              <span class="custom-select__option-content">
                <span class="custom-select__option-label">Danger full access</span>
                <span class="custom-select__option-desc">Unrestricted file and network access</span>
              </span>
              <span class="custom-select__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </button>

        </div>

        <!-- Model -->
        <div class="custom-select" id="modelSelect">
          <span class="custom-select__label">Model</span>
          <button
            class="custom-select__trigger"
            type="button"
            aria-expanded="false"
            aria-haspopup="listbox"
          >
            <span class="custom-select__trigger-value">Default</span>
            <svg class="custom-select__chevron" viewBox="0 0 16 16" fill="none">
              <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="custom-select__menu" style="display:none" role="listbox">
            <button class="custom-select__option is-active" role="option">
              <span class="custom-select__option-content">
                <span class="custom-select__option-label">Default</span>
                <span class="custom-select__option-desc">Use the backend default model</span>
              </span>
              <span class="custom-select__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </button>
            <button class="custom-select__option" role="option">
              <span class="custom-select__option-content">
                <span class="custom-select__option-label">o3</span>
              </span>
              <span class="custom-select__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </button>
            <button class="custom-select__option" role="option">
              <span class="custom-select__option-content">
                <span class="custom-select__option-label">o4-mini</span>
              </span>
              <span class="custom-select__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </button>
            <button class="custom-select__option" role="option">
              <span class="custom-select__option-content">
                <span class="custom-select__option-label">Custom model ID</span>
              </span>
              <span class="custom-select__option-check"><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </button>
          </div>
        </div>

        <button class="settings-reset" type="button">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M2 2V6H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 10A6 6 0 1 0 4 4.5L2 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Reset to defaults

        <p class="settings-note">Applies to the next run for this thread.</p>
      </div>

      <!-- Actions -->
      <div class="settings-section">
        <div class="settings-section__header">Actions</div>
        <div class="action-row">
          <button class="action-btn" type="button">
            <svg class="action-btn__icon" viewBox="0 0 16 16" fill="none">
              <path d="M11.5 2.5L13.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M4.5 9.5L11 3L13 5L6.5 11.5L3.5 12.5L4.5 9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            Rename

          <button class="action-btn action-btn--danger" type="button">
            <svg class="action-btn__icon" viewBox="0 0 16 16" fill="none">
              <rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M2 6.5H14" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 3V1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Archive

      </div>

      <!-- Debug -->
      <div class="settings-section">
        <div class="debug-disclosure">
          <button class="debug-disclosure__trigger" type="button" aria-expanded="false" id="debugToggle">
            <svg class="debug-disclosure__chevron" viewBox="0 0 16 16" fill="none">
              <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Debug

          <div class="debug-disclosure__body" id="debugBody">

              <span class="debug-row__label">Session ID</span>

                <code class="debug-row__value">019d3f48…c9cde8356</code>
                <button class="debug-row__copy-btn" type="button" aria-label="Copy Session ID">
                  <svg viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="8" height="8" rx="1.2" stroke="currentColor" stroke-width="1.4"/><path d="M11 3H4.5A1.5 1.5 0 0 0 3 4.5V11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                </button>

              <span class="debug-row__label">latestTurn.status</span>
              <code class="debug-row__value">inProgress</code>
            </div>
            <div class="debug-row">
              <span class="debug-row__label">thread.status.type</span>
              <code class="debug-row__value">active</code>
            </div>

</div>

<script>
// ── Chip toggle ──
document.getElementById('chipTrack').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('is-active'));
  chip.classList.add('is-active');
});

// ── Workspace combobox ──
const comboTrigger = document.getElementById('comboboxTrigger');
const comboDropdown = document.getElementById('comboboxDropdown');
const comboSearch = document.getElementById('comboboxSearch');
const comboList = document.getElementById('comboboxList');

comboTrigger.addEventListener('click', () => {
  const isOpen = comboTrigger.getAttribute('aria-expanded') === 'true';
  comboTrigger.setAttribute('aria-expanded', !isOpen);
  comboDropdown.style.display = isOpen ? 'none' : 'flex';
  if (!isOpen) {
    comboSearch.value = '';
    filterComboOptions('');
    setTimeout(() => comboSearch.focus(), 50);
  }
});

comboSearch.addEventListener('input', (e) => filterComboOptions(e.target.value));

function filterComboOptions(query) {
  const q = query.toLowerCase();
  comboList.querySelectorAll('.combobox__option').forEach(opt => {
    const label = opt.querySelector('.combobox__option-label').textContent.toLowerCase();
    opt.style.display = label.includes(q) ? '' : 'none';
  });
  const visible = comboList.querySelectorAll('.combobox__option[style=""]').length +
                  comboList.querySelectorAll('.combobox__option:not([style])').length;
}

comboList.addEventListener('click', (e) => {
  const opt = e.target.closest('.combobox__option');
  if (!opt) return;
  comboList.querySelectorAll('.combobox__option').forEach(o => {
    o.classList.remove('is-active');
    o.setAttribute('aria-selected', 'false');
  });
  opt.classList.add('is-active');
  opt.setAttribute('aria-selected', 'true');
  comboTrigger.querySelector('.combobox__trigger-text').textContent =
    opt.querySelector('.combobox__option-label').textContent;
  comboTrigger.setAttribute('aria-expanded', 'false');
  comboDropdown.style.display = 'none';
});

// ── Custom selects ──
document.querySelectorAll('.custom-select').forEach(select => {
  const trigger = select.querySelector('.custom-select__trigger');
  const menu = select.querySelector('.custom-select__menu');
  if (!trigger || !menu) return;

  trigger.addEventListener('click', () => {
    const isOpen = trigger.getAttribute('aria-expanded') === 'true';
    // Close all other selects
    document.querySelectorAll('.custom-select__trigger[aria-expanded="true"]').forEach(t => {
      if (t !== trigger) {
        t.setAttribute('aria-expanded', 'false');
        t.closest('.custom-select').querySelector('.custom-select__menu').style.display = 'none';
      }
    });
    trigger.setAttribute('aria-expanded', !isOpen);
    menu.style.display = isOpen ? 'none' : 'block';
  });

  menu.addEventListener('click', (e) => {
    const opt = e.target.closest('.custom-select__option');
    if (!opt) return;
    menu.querySelectorAll('.custom-select__option').forEach(o => o.classList.remove('is-active'));
    opt.classList.add('is-active');
    trigger.querySelector('.custom-select__trigger-value').textContent =
      opt.querySelector('.custom-select__option-label').textContent;
    trigger.setAttribute('aria-expanded', 'false');
    menu.style.display = 'none';
  });
});

// ── Search clear ──
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
searchInput.addEventListener('input', () => {
  searchClear.style.display = searchInput.value ? '' : 'none';
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.style.display = 'none';
  searchInput.focus();
});

// ── Debug disclosure ──
const debugToggle = document.getElementById('debugToggle');
debugToggle.addEventListener('click', () => {
  const isOpen = debugToggle.getAttribute('aria-expanded') === 'true';
  debugToggle.setAttribute('aria-expanded', !isOpen);
});

// ── Close menus on outside click ──
document.addEventListener('click', (e) => {
  if (!e.target.closest('#workspaceCombobox')) {
    comboTrigger.setAttribute('aria-expanded', 'false');
    comboDropdown.style.display = 'none';
  }
  if (!e.target.closest('.custom-select')) {
    document.querySelectorAll('.custom-select__trigger[aria-expanded="true"]').forEach(t => {
      t.setAttribute('aria-expanded', 'false');
      t.closest('.custom-select').querySelector('.custom-select__menu').style.display = 'none';
    });
  }
});
</script>

</body>
